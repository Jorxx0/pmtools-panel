<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panel PMTools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6f8;
    --superficie: #ffffff;
    --borde: #e4e8ec;
    --texto: #14181d;
    --texto-secundario: #6b7684;
    --texto-terciario: #9aa4b0;
    --acento: #2f6fed;
    --acento-suave: #eaf1ff;
    --verde: #1a9c6d;
    --verde-suave: #e5f7f0;
    --rojo: #d93b3b;
    --rojo-suave: #fbeaea;
    --naranja: #c97a12;
    --naranja-suave: #fbf1de;
    --sombra: 0 1px 2px rgba(20,24,29,0.04), 0 8px 24px -12px rgba(20,24,29,0.08);
    --radio: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116;
      --superficie: #171b22;
      --borde: #262c35;
      --texto: #eef1f5;
      --texto-secundario: #9aa5b3;
      --texto-terciario: #6b7684;
      --acento: #5b9bff;
      --acento-suave: rgba(91,155,255,0.12);
      --verde: #3ecf8e;
      --verde-suave: rgba(62,207,142,0.12);
      --rojo: #ff6b6b;
      --rojo-suave: rgba(255,107,107,0.12);
      --naranja: #f2a93c;
      --naranja-suave: rgba(242,169,60,0.12);
      --sombra: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--texto);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
  }
  h1, h2, .valor-stat { font-family: "Inter Tight", "Inter", sans-serif; }
  .contenedor { max-width: 1080px; margin: 0 auto; padding: 28px 20px 80px; }
  button {
    font: inherit;
    background: var(--acento);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.9; }
  button.secundario {
    background: var(--superficie);
    color: var(--texto-secundario);
    border: 1px solid var(--borde);
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .icono { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }

  /* --- Login --- */
  #login-vista {
    max-width: 380px;
    margin: 14vh auto 0;
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    padding: 32px;
    box-shadow: var(--sombra);
  }
  #login-vista .marca { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  #login-vista .marca .icono-marca {
    width: 38px; height: 38px; border-radius: 10px; background: var(--acento-suave);
    display: flex; align-items: center; justify-content: center; color: var(--acento); flex-shrink: 0;
  }
  #login-vista .marca .icono-marca svg { width: 20px; height: 20px; }
  #login-vista h2 { margin: 0; font-size: 1.15rem; font-weight: 700; }
  #login-vista .marca .sub { color: var(--texto-secundario); font-size: 0.78rem; margin-top: 1px; }
  #login-vista label { display: block; font-size: 0.78rem; font-weight: 500; color: var(--texto-secundario); margin: 16px 0 6px; }
  #login-vista input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--borde);
    color: var(--texto);
    border-radius: 9px;
    padding: 11px 13px;
    font: inherit;
    font-size: 0.95rem;
  }
  #login-vista input:focus { outline: 2px solid var(--acento); outline-offset: -1px; }
  #login-vista button { width: 100%; margin-top: 22px; }
  #login-error {
    color: var(--rojo); background: var(--rojo-suave); border-radius: 8px;
    font-size: 0.82rem; margin-top: 14px; padding: 0; text-align: center;
    max-height: 0; overflow: hidden; transition: all 0.15s;
  }
  #login-error:not(:empty) { padding: 8px; max-height: 60px; }

  /* --- Cabecera --- */
  .cabecera-sticky {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    margin: 0 -20px; padding: 0 20px;
    border-bottom: 1px solid var(--borde);
  }
  header.top { display: flex; align-items: center; justify-content: space-between; padding: 20px 0 16px; }
  header.top .marca { display: flex; align-items: center; gap: 10px; }
  header.top .icono-marca {
    width: 34px; height: 34px; border-radius: 9px; background: var(--acento-suave);
    display: flex; align-items: center; justify-content: center; color: var(--acento);
  }
  header.top .icono-marca svg { width: 18px; height: 18px; }
  header.top h1 { font-size: 1.05rem; margin: 0; font-weight: 700; }
  header.top .sub { color: var(--texto-terciario); font-size: 0.76rem; }
  header.top .acciones { display: flex; gap: 8px; }

  /* --- Navegación por pestañas --- */
  nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    background: transparent; color: var(--texto-secundario); font-weight: 600;
    border: none; border-radius: 0; padding: 10px 4px; margin-right: 22px;
    border-bottom: 2px solid transparent; white-space: nowrap; font-size: 0.86rem;
  }
  nav.tabs button:hover { opacity: 1; color: var(--texto); }
  nav.tabs button.activa { color: var(--acento); border-bottom-color: var(--acento); }
  .vista { display: none; padding-top: 22px; }
  .vista.activa { display: block; }

  /* --- Estadísticas --- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .stat {
    background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio);
    padding: 16px 18px; box-shadow: var(--sombra);
  }
  .stat .etiqueta { display: flex; align-items: center; gap: 6px; color: var(--texto-secundario); font-size: 0.76rem; font-weight: 500; margin-bottom: 8px; }
  .stat .valor-stat { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
  .stat .detalle { color: var(--texto-terciario); font-size: 0.75rem; margin-top: 2px; }
  .stat.alerta .valor-stat { color: var(--naranja); }

  /* --- Tarjetas de datos --- */
  .tarjeta {
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    padding: 20px 20px 6px;
    margin-bottom: 20px;
    box-shadow: var(--sombra);
  }
  .tarjeta-cabecera { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; flex-wrap: wrap; gap: 4px; }
  .tarjeta h2 {
    margin: 0; font-size: 0.95rem; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .tarjeta h2 .icono-titulo {
    width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    background: var(--acento-suave); color: var(--acento);
  }
  .tarjeta h2 .icono-titulo svg { width: 14px; height: 14px; }
  .tarjeta .actualizado { color: var(--texto-terciario); font-size: 0.72rem; }
  .tarjeta-scroll { overflow-x: auto; margin: 12px -20px 0; padding: 0 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.86rem; white-space: nowrap; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--borde); }
  th { color: var(--texto-terciario); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tbody tr:hover { background: var(--bg); }
  tbody tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 600;
  }
  .badge svg { width: 11px; height: 11px; }
  .badge.bajo { background: var(--rojo-suave); color: var(--rojo); }
  .badge.alto { background: var(--naranja-suave); color: var(--naranja); }
  .badge.pendiente { background: var(--naranja-suave); color: var(--naranja); }
  .badge.saldada { background: var(--verde-suave); color: var(--verde); }
  .vacio { color: var(--texto-terciario); font-size: 0.85rem; padding: 24px 0; text-align: center; }
  .buscador {
    width: 100%; max-width: 260px; margin-left: auto;
    background: var(--bg); border: 1px solid var(--borde); border-radius: 8px;
    padding: 7px 11px; font: inherit; font-size: 0.82rem; color: var(--texto);
  }
  .fila-nota { cursor: pointer; }
  .fila-nota td:first-child { font-weight: 600; }
  .detalle-nota { display: none; }
  .detalle-nota.abierto { display: table-row; }
  .detalle-nota td { border-bottom: 1px solid var(--borde); background: var(--bg); padding: 10px 10px 14px; }
  .linea-nota { font-size: 0.8rem; color: var(--texto-secundario); padding: 3px 0; display: flex; justify-content: space-between; max-width: 420px; }
  .linea-nota .comentario { font-style: italic; }
  .chevron { display: inline-block; transition: transform 0.15s; color: var(--texto-terciario); }
  .chevron.abierto { transform: rotate(90deg); }
  .balance.positivo { color: var(--verde); font-weight: 600; }
  .balance.negativo { color: var(--rojo); font-weight: 600; }

  /* --- Gráfico de balance --- */
  .grafico-barra { display: flex; align-items: flex-end; gap: 6px; height: 120px; margin: 8px 0 6px; }
  .grafico-barra .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
  .grafico-barra .barra { width: 100%; max-width: 26px; border-radius: 4px 4px 0 0; min-height: 3px; transition: opacity 0.15s; }
  .grafico-barra .barra.positivo { background: var(--verde); }
  .grafico-barra .barra.negativo { background: var(--rojo); }
  .grafico-barra .col:hover .barra { opacity: 0.75; }
  .grafico-barra .etiqueta-dia { font-size: 0.62rem; color: var(--texto-terciario); }
  .grafico-eje-cero { border-top: 1px dashed var(--borde); }

  /* --- Avisos --- */
  .avisos { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .avisos .grupo h3 { font-size: 0.8rem; margin: 0 0 8px; color: var(--texto-secundario); font-weight: 600; }
  .avisos ul { list-style: none; margin: 0; padding: 0; }
  .avisos li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--borde); font-size: 0.85rem; }
  .avisos li:last-child { border-bottom: none; }
  .avisos li .cliente { font-weight: 500; }
  .avisos li .valor { color: var(--naranja); font-weight: 600; }

  @media (max-width: 640px) {
    header.top .sub { display: none; }
    .contenedor { padding: 0 14px 60px; }
    .cabecera-sticky { margin: 0 -14px; padding: 0 14px; }
  }
</style>
</head>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// Mismo proyecto que usa PMTools para subir el snapshot (ver PanelSupabase.swift).
const SUPABASE_URL = 'https://plladparekwaxsmsbxon.supabase.co';
const SUPABASE_KEY = 'sb_publishable_M9KPR6mrulO1HAC5369SPA_W1KTXYiy';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const loginVista = document.getElementById('login-vista');
const datosVista = document.getElementById('datos-vista');
const loginEmail = document.getElementById('login-email');
const loginPass = document.getElementById('login-pass');
const loginError = document.getElementById('login-error');

const euros = (n) => (Number(n) || 0).toLocaleString('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0, useGrouping: true });
const eurosDec = (n) => (Number(n) || 0).toLocaleString('es-ES', { style: 'currency', currency: 'EUR', useGrouping: true });
const numero = (n) => (Number(n) || 0).toLocaleString('es-ES', { useGrouping: true });
const fechaCorta = (iso) => iso ? new Date(iso).toLocaleString('es-ES', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
const iconoAlerta = '<svg viewBox="0 0 24 24" class="icono"><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3ZM12 9v4M12 17h.01"/></svg>';
const iconoCheck = '<svg viewBox="0 0 24 24" class="icono"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m22 4-10 10.01-3-3"/></svg>';

let datosActuales = { inventario: null, ubicaciones: null, notas: null, ventas: null };

/// Clave de día local (yyyy-mm-dd) a partir de una fecha ISO, usando el
/// huso horario del navegador — igual que agrupa por día VistaCuentas en la
/// app (calendario local, no UTC).
function diaKey(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const diaLegible = (key) => new Date(`${key}T12:00:00`).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });

/// Junta Notas y Ventas por día para el balance de Cuentas, igual que
/// ResumenDiaCuentas en la app: las notas por transferencia o pago externo
/// no cuentan; las pendientes de pago sí cuentan igual.
function calcularCuentas(notas, ventas) {
  const dias = {};
  for (const n of notas) {
    if (n.facturaTransferencia || n.externo) continue;
    const k = diaKey(n.fecha);
    dias[k] = dias[k] || { notas: 0, ventas: 0 };
    dias[k].notas += (n.lineas || []).reduce((s, l) => s + l.cantidad * l.precioUnitario, 0);
  }
  for (const v of ventas) {
    const k = diaKey(v.fecha);
    dias[k] = dias[k] || { notas: 0, ventas: 0 };
    const base = (v.lineas || []).reduce((s, l) => s + l.cantidad * l.precioUnitario, 0);
    dias[k].ventas += base * (1 + (v.ivaPorcentaje || 0) / 100);
  }
  return Object.entries(dias)
    .map(([dia, v]) => ({ dia, notas: v.notas, ventas: v.ventas, balance: v.notas - v.ventas }))
    .sort((a, b) => b.dia.localeCompare(a.dia));
}

async function iniciarSesion() {
  loginError.textContent = '';
  const { error } = await supabase.auth.signInWithPassword({
    email: loginEmail.value.trim(),
    password: loginPass.value,
  });
  if (error) {
    loginError.textContent = 'No se pudo iniciar sesión: ' + error.message;
    return;
  }
  mostrarPanel();
}

document.getElementById('login-btn').addEventListener('click', iniciarSesion);
loginPass.addEventListener('keydown', (e) => { if (e.key === 'Enter') iniciarSesion(); });

document.getElementById('logout-btn').addEventListener('click', async () => {
  await supabase.auth.signOut();
  datosVista.style.display = 'none';
  loginVista.style.display = 'block';
});

document.getElementById('recargar-btn').addEventListener('click', cargarDatos);
document.getElementById('notas-buscador').addEventListener('input', (e) => pintarNotas(datosActuales.notas, e.target.value));
document.getElementById('ventas-buscador').addEventListener('input', (e) => pintarVentas(datosActuales.ventas, e.target.value));

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-vista]');
  if (!btn) return;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('activa', b === btn));
  document.querySelectorAll('.vista').forEach(v => v.classList.toggle('activa', v.dataset.vista === btn.dataset.vista));
  window.scrollTo({ top: 0, behavior: 'auto' });
});

async function mostrarPanel() {
  loginVista.style.display = 'none';
  datosVista.style.display = 'block';
  await cargarDatos();
}

async function cargarDatos() {
  const { data, error } = await supabase.from('panel_datos').select('*');
  if (error) {
    ['cuentas', 'inventario', 'ubicaciones', 'notas', 'ventas'].forEach(t => {
      document.getElementById(`${t}-contenido`).innerHTML = `<div class="vacio">Error al cargar: ${error.message}</div>`;
    });
    return;
  }
  const porTipo = Object.fromEntries((data || []).map(fila => [fila.tipo, fila]));
  datosActuales = porTipo;
  pintarStats(porTipo);
  pintarGrafico(porTipo);
  pintarAvisos(porTipo);
  pintarCuentas(porTipo);
  pintarInventario(porTipo.inventario);
  pintarUbicaciones(porTipo.ubicaciones);
  pintarNotas(porTipo.notas, '');
  pintarVentas(porTipo.ventas, '');
}

function pintarStats(porTipo) {
  const inv = porTipo.inventario?.datos || [];
  const ubic = porTipo.ubicaciones?.datos || [];
  const notas = porTipo.notas?.datos?.notas || [];

  const valorInventario = inv.reduce((s, p) => s + (p.pilas * p.paletsPorpila + p.paletsRestantes) * p.precio, 0);
  const totalPalets = inv.reduce((s, p) => s + p.pilas * p.paletsPorpila + p.paletsRestantes, 0);
  const stockBajo = inv.filter(p => p.umbralMinimo != null && p.pilas < p.umbralMinimo).length;

  const paletsUbicados = ubic.reduce((s, u) => s + u.cantidad, 0);

  const pendientes = notas.filter(n => {
    const total = (n.lineas || []).reduce((s, l) => s + l.cantidad * l.precioUnitario, 0);
    const abonado = (n.abonos || []).reduce((s, a) => s + a.importe, 0);
    return n.pendientePago && Math.max(0, total - abonado) > 0.005;
  });
  const importePendiente = pendientes.reduce((s, n) => {
    const total = (n.lineas || []).reduce((s2, l) => s2 + l.cantidad * l.precioUnitario, 0);
    const abonado = (n.abonos || []).reduce((s2, a) => s2 + a.importe, 0);
    return s + Math.max(0, total - abonado);
  }, 0);

  const ventas = porTipo.ventas?.datos || [];
  const cuentas = calcularCuentas(notas, ventas);
  const mesActual = diaKey(new Date().toISOString()).slice(0, 7);
  const balanceMes = cuentas.filter(c => c.dia.startsWith(mesActual)).reduce((s, c) => s + c.balance, 0);

  const stats = [
    { etiqueta: 'Balance del mes', valor: eurosDec(balanceMes), detalle: 'notas − ventas', alerta: balanceMes < 0 },
    { etiqueta: 'Valor de inventario', valor: euros(valorInventario), detalle: `${numero(totalPalets)} palets` },
    { etiqueta: 'Pilas en ubicaciones', valor: numero(ubic.length), detalle: `${numero(paletsUbicados)} palets colocados` },
    { etiqueta: 'Notas pendientes', valor: numero(pendientes.length), detalle: pendientes.length ? eurosDec(importePendiente) : 'al día', alerta: pendientes.length > 0 },
    { etiqueta: 'Stock bajo mínimo', valor: numero(stockBajo), detalle: stockBajo ? 'tipos por debajo' : 'todo correcto', alerta: stockBajo > 0 },
  ];

  document.getElementById('stats').innerHTML = stats.map(s => `
    <div class="stat ${s.alerta ? 'alerta' : ''}">
      <div class="etiqueta">${s.etiqueta}</div>
      <div class="valor-stat">${s.valor}</div>
      <div class="detalle">${s.detalle}</div>
    </div>
  `).join('');
}

/// Barras del balance diario (notas − ventas) de los últimos 14 días con
/// datos, escaladas al mayor valor absoluto del tramo para que se vean
/// proporcionadas tanto las positivas como las negativas.
function pintarGrafico(porTipo) {
  const contenido = document.getElementById('grafico-contenido');
  const notas = porTipo.notas?.datos?.notas || [];
  const ventas = porTipo.ventas?.datos || [];
  const cuentas = calcularCuentas(notas, ventas).slice(0, 14).reverse();
  if (!cuentas.length) { contenido.innerHTML = '<div class="vacio">Sin datos suficientes todavía.</div>'; return; }

  const maximo = Math.max(1, ...cuentas.map(c => Math.abs(c.balance)));
  const columnas = cuentas.map(c => {
    const alturaPct = Math.max(2, Math.round((Math.abs(c.balance) / maximo) * 100));
    const dia = new Date(`${c.dia}T12:00:00`);
    return `<div class="col" title="${diaLegible(c.dia)}: ${eurosDec(c.balance)}">
      <div class="barra ${c.balance >= 0 ? 'positivo' : 'negativo'}" style="height:${alturaPct}%"></div>
      <div class="etiqueta-dia">${dia.getDate()}</div>
    </div>`;
  }).join('');
  contenido.innerHTML = `<div class="grafico-barra">${columnas}</div>`;
}

/// Lista rápida de lo que necesita atención: notas pendientes de cobro y
/// tipos de palet por debajo de su umbral mínimo. Oculta la tarjeta entera
/// si no hay ningún aviso.
function pintarAvisos(porTipo) {
  const tarjeta = document.getElementById('avisos-tarjeta');
  const contenido = document.getElementById('avisos-contenido');
  const inv = (porTipo.inventario?.datos || []).filter(p => p.umbralMinimo != null && p.pilas < p.umbralMinimo);
  const notas = (porTipo.notas?.datos?.notas || []).filter(n => {
    const total = (n.lineas || []).reduce((s, l) => s + l.cantidad * l.precioUnitario, 0);
    const abonado = (n.abonos || []).reduce((s, a) => s + a.importe, 0);
    return n.pendientePago && Math.max(0, total - abonado) > 0.005;
  });
  if (!inv.length && !notas.length) { tarjeta.style.display = 'none'; return; }
  tarjeta.style.display = '';

  const grupoNotas = notas.length ? `<div class="grupo">
    <h3>Notas pendientes de cobro (${notas.length})</h3>
    <ul>${notas.map(n => {
      const total = (n.lineas || []).reduce((s, l) => s + l.cantidad * l.precioUnitario, 0);
      const abonado = (n.abonos || []).reduce((s, a) => s + a.importe, 0);
      return `<li><span class="cliente">${n.clienteNombre}</span><span class="valor">${eurosDec(Math.max(0, total - abonado))}</span></li>`;
    }).join('')}</ul>
  </div>` : '';
  const grupoInv = inv.length ? `<div class="grupo">
    <h3>Stock por debajo del mínimo (${inv.length})</h3>
    <ul>${inv.map(p => `<li><span class="cliente">${p.nombre}</span><span class="valor">${numero(p.pilas)} / ${numero(p.umbralMinimo)} pilas</span></li>`).join('')}</ul>
  </div>` : '';
  contenido.innerHTML = grupoNotas + grupoInv;
}

function pintarCuentas(porTipo) {
  const contenido = document.getElementById('cuentas-contenido');
  const fNotas = porTipo.notas, fVentas = porTipo.ventas;
  const masReciente = [fNotas?.actualizado_en, fVentas?.actualizado_en].filter(Boolean).sort().pop();
  document.getElementById('cuentas-actualizado').textContent = masReciente ? `Actualizado ${fechaCorta(masReciente)}` : 'Sin datos todavía';

  const notas = fNotas?.datos?.notas || [];
  const ventas = fVentas?.datos || [];
  const cuentas = calcularCuentas(notas, ventas);
  if (!cuentas.length) { contenido.innerHTML = '<div class="vacio">Sin notas ni ventas todavía.</div>'; return; }

  const filas = cuentas.map(c => `<tr>
      <td style="text-transform:capitalize">${diaLegible(c.dia)}</td>
      <td class="num">${eurosDec(c.notas)}</td>
      <td class="num">${eurosDec(c.ventas)}</td>
      <td class="num balance ${c.balance >= 0 ? 'positivo' : 'negativo'}">${eurosDec(c.balance)}</td>
    </tr>`).join('');
  contenido.innerHTML = `<table>
    <thead><tr><th>Día</th><th class="num">Notas</th><th class="num">Ventas</th><th class="num">Balance</th></tr></thead>
    <tbody>${filas}</tbody>
  </table>`;
}

function pintarInventario(fila) {
  const contenido = document.getElementById('inventario-contenido');
  document.getElementById('inventario-actualizado').textContent = fila ? `Actualizado ${fechaCorta(fila.actualizado_en)}` : 'Sin datos todavía';
  const items = (fila?.datos || []).slice().sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  if (!items.length) { contenido.innerHTML = '<div class="vacio">Sin palets en Inventario.</div>'; return; }
  const filas = items.map(p => {
    const total = p.pilas * p.paletsPorpila + p.paletsRestantes;
    let badge = '';
    if (p.umbralMinimo != null && p.pilas < p.umbralMinimo) badge = `<span class="badge bajo">${iconoAlerta} Stock bajo</span>`;
    else if (p.umbralMaximo != null && p.pilas > p.umbralMaximo) badge = `<span class="badge alto">${iconoAlerta} Exceso</span>`;
    return `<tr>
      <td>${p.nombre} ${badge}</td>
      <td class="num">${numero(p.pilas)}</td>
      <td class="num">${numero(p.paletsPorpila)}</td>
      <td class="num">${numero(p.paletsRestantes)}</td>
      <td class="num">${numero(total)}</td>
      <td class="num">${eurosDec(p.precio)}</td>
      <td class="num">${eurosDec(total * p.precio)}</td>
    </tr>`;
  }).join('');
  contenido.innerHTML = `<table>
    <thead><tr><th>Tipo</th><th class="num">Pilas</th><th class="num">P/pila</th><th class="num">Sueltos</th><th class="num">Total ud.</th><th class="num">Precio</th><th class="num">Valor</th></tr></thead>
    <tbody>${filas}</tbody>
  </table>`;
}

function pintarUbicaciones(fila) {
  const contenido = document.getElementById('ubicaciones-contenido');
  document.getElementById('ubicaciones-actualizado').textContent = fila ? `Actualizado ${fechaCorta(fila.actualizado_en)}` : 'Sin datos todavía';
  const items = (fila?.datos || []).slice().sort((a, b) =>
    a.nave - b.nave || a.pasillo - b.pasillo || a.posicion - b.posicion
  );
  if (!items.length) { contenido.innerHTML = '<div class="vacio">Sin pilas en Ubicaciones.</div>'; return; }
  const filas = items.map(u => `<tr>
      <td>${u.nave}.${u.pasillo}.${u.posicion}</td>
      <td>${u.tipoPalet}</td>
      <td class="num">${numero(u.cantidad)}</td>
      <td>${u.comentario || ''}</td>
    </tr>`).join('');
  contenido.innerHTML = `<table>
    <thead><tr><th>Código</th><th>Tipo</th><th class="num">Cantidad</th><th>Comentario</th></tr></thead>
    <tbody>${filas}</tbody>
  </table>`;
}

function pintarNotas(fila, filtro) {
  const contenido = document.getElementById('notas-contenido');
  document.getElementById('notas-actualizado').textContent = fila ? `Actualizado ${fechaCorta(fila.actualizado_en)}` : 'Sin datos todavía';
  let notas = fila?.datos?.notas || [];
  if (filtro) {
    const q = filtro.toLowerCase();
    notas = notas.filter(n => n.clienteNombre.toLowerCase().includes(q));
  }
  if (!notas.length) { contenido.innerHTML = '<div class="vacio">Sin notas que mostrar.</div>'; return; }
  const ordenadas = notas.slice().sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
  const filas = ordenadas.map((n, i) => {
    const total = (n.lineas || []).reduce((s, l) => s + l.cantidad * l.precioUnitario, 0);
    const abonado = (n.abonos || []).reduce((s, a) => s + a.importe, 0);
    const pendiente = Math.max(0, total - abonado);
    const saldada = (n.abonos || []).length > 0 && pendiente <= 0.005;
    let badge = '';
    if (n.pendientePago && !saldada) badge = `<span class="badge pendiente">${iconoAlerta} Pendiente</span>`;
    else if (saldada) badge = `<span class="badge saldada">${iconoCheck} Saldada</span>`;
    const lineas = (n.lineas || []).map(l =>
      `<div class="linea-nota"><span>${l.cantidad} × ${l.tipoPalet}</span><span>${eurosDec(l.precioUnitario)}/ud</span></div>`
    ).join('');
    const comentario = n.comentario ? `<div class="linea-nota comentario">"${n.comentario}"</div>` : '';
    return `<tr class="fila-nota">
        <td><span class="chevron">▸</span> ${n.clienteNombre}</td>
        <td>${fechaCorta(n.fecha)}</td>
        <td class="num">${eurosDec(total)}</td>
        <td>${badge}</td>
      </tr>
      <tr class="detalle-nota"><td colspan="4">${lineas}${comentario}</td></tr>`;
  }).join('');
  contenido.innerHTML = `<table>
    <thead><tr><th>Cliente</th><th>Fecha</th><th class="num">Total</th><th>Estado</th></tr></thead>
    <tbody>${filas}</tbody>
  </table>`;
  activarFilasExpandibles(contenido);
}

function pintarVentas(fila, filtro) {
  const contenido = document.getElementById('ventas-contenido');
  document.getElementById('ventas-actualizado').textContent = fila ? `Actualizado ${fechaCorta(fila.actualizado_en)}` : 'Sin datos todavía';
  let ventas = fila?.datos || [];
  if (filtro) {
    const q = filtro.toLowerCase();
    ventas = ventas.filter(v => v.clienteNombre.toLowerCase().includes(q));
  }
  if (!ventas.length) { contenido.innerHTML = '<div class="vacio">Sin ventas que mostrar.</div>'; return; }
  const ordenadas = ventas.slice().sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
  const filas = ordenadas.map(v => {
    const base = (v.lineas || []).reduce((s, l) => s + l.cantidad * l.precioUnitario, 0);
    const total = base * (1 + (v.ivaPorcentaje || 0) / 100);
    const lineas = (v.lineas || []).map(l =>
      `<div class="linea-nota"><span>${l.cantidad} × ${l.producto}</span><span>${eurosDec(l.precioUnitario)}/ud</span></div>`
    ).join('');
    const comentario = v.comentario ? `<div class="linea-nota comentario">"${v.comentario}"</div>` : '';
    return `<tr class="fila-nota">
        <td><span class="chevron">▸</span> ${v.clienteNombre}</td>
        <td>${fechaCorta(v.fecha)}</td>
        <td class="num">${v.ivaPorcentaje ? `${v.ivaPorcentaje}%` : '—'}</td>
        <td class="num">${eurosDec(total)}</td>
      </tr>
      <tr class="detalle-nota"><td colspan="4">${lineas}${comentario}</td></tr>`;
  }).join('');
  contenido.innerHTML = `<table>
    <thead><tr><th>Cliente</th><th>Fecha</th><th class="num">IVA</th><th class="num">Total</th></tr></thead>
    <tbody>${filas}</tbody>
  </table>`;
  activarFilasExpandibles(contenido);
}

/// Hace clicable cada fila ".fila-nota" para mostrar/ocultar su detalle
/// (la fila ".detalle-nota" justo debajo), usado por Notas y Ventas.
function activarFilasExpandibles(contenido) {
  contenido.querySelectorAll('.fila-nota').forEach(tr => {
    tr.addEventListener('click', () => {
      tr.nextElementSibling.classList.toggle('abierto');
      tr.querySelector('.chevron').classList.toggle('abierto');
    });
  });
}

// Si ya hay sesión guardada en el navegador, entrar directo sin pedir login.
supabase.auth.getSession().then(({ data }) => {
  if (data.session) mostrarPanel();
});
</script>
